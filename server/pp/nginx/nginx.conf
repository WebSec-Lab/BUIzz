worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    ##################################################################
    # victim - HTTP
    ##################################################################
    server {
        listen 80;
        server_name attacker.com;   

        location / {
            proxy_pass http://flask:5221;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    ##################################################################
    # victim - HTTPS
    ##################################################################
    server {
        listen 443 ssl;
        server_name attacker.com;

        ssl_certificate     /etc/nginx/certs/victim.com+1.pem;
        ssl_certificate_key /etc/nginx/certs/victim.com+1-key.pem;

        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://flask:5221;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    ##################################################################
    # attacker.com - HTTP ONLY
    ##################################################################
    server {
        listen 80;
        server_name victim.com;

        location / {
            proxy_pass http://flask:5221;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    ##################################################################
    # attacker.com - HTTPS 
    ##################################################################
    server {
    listen 443 ssl;
    server_name victim.com;

        ssl_certificate     /etc/nginx/certs/victim.com+1.pem;
        ssl_certificate_key /etc/nginx/certs/victim.com+1-key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://flask:5221;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
}
