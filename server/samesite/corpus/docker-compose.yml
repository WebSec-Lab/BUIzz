version: '3'
services:
  # reverse proxy
  nginx:
    image: nginx:latest
    container_name: reverse_proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx:/etc/nginx/conf.d # nginx config files
      - ./certs:/etc/nginx/certs  # certificate path
    networks:
      - custom_net
    depends_on: # ensure other sites start first
      - site1
      - site2
      - site3

  # individual website services
  site1:
    build: ./site1
    container_name: site1
    volumes:
      - ./site1:/var/www/html
    networks:
      custom_net:
        ipv4_address: 172.25.0.11

  site2:
    build: ./site2
    container_name: site2
    volumes:
      - ./site2:/var/www/html
    networks:
      custom_net:
        ipv4_address: 172.25.0.12

  site3:
    build: ./site3
    container_name: site3
    volumes:
      - ./site3:/var/www/html
    networks:
      custom_net:
        ipv4_address: 172.25.0.13

networks:
  custom_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/24


# change C:\Windows\System32\drivers\etc\hosts
