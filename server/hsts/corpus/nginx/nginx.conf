user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # HTTP: attacker.test
    server {
        listen 80;
        server_name attacker.test;
        location / {
            proxy_pass http://site1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto http;
        }
    }

    # HTTP: adition.com
    server {
        listen 80;
        server_name adition.com;
        location / {
            proxy_pass http://site2;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto http;
        }
    }

    # HTTP: leak.test
    # s0/ is stripped so existing root-level files (header-link, redirect, etc.) are reused;
    # s2/ and s4/ are NOT stripped so their own subdirectories serve distinct content.
    server {
        listen 80;
        server_name leak.test;
        location ~* ^/s0/(.*) {
            rewrite ^/s0/(.*) /$1 break;
            proxy_pass http://site3;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto http;
        }
        location / {
            proxy_pass http://site3;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto http;
        }
    }

    # HTTPS: attacker.test
    server {
        listen 443 ssl;
        server_name attacker.test;

        ssl_certificate     /certs/leak.test+1.pem;
        ssl_certificate_key /certs/leak.test+1-key.pem;

        location / {
            proxy_pass http://site1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # HTTPS: adition.com — HSTS header set here so browser caches upgrade rule
    server {
        listen 443 ssl;
        server_name adition.com;

        ssl_certificate     /certs/leak.test+1.pem;
        ssl_certificate_key /certs/leak.test+1-key.pem;

        add_header Strict-Transport-Security "max-age=31536000" always;

        location / {
            proxy_pass http://site2;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # HTTPS: leak.test
    server {
        listen 443 ssl;
        server_name leak.test;

        ssl_certificate     /certs/leak.test+1.pem;
        ssl_certificate_key /certs/leak.test+1-key.pem;

        location ~* ^/s0/(.*) {
            rewrite ^/s0/(.*) /$1 break;
            proxy_pass http://site3;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }
        location / {
            proxy_pass http://site3;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
