version: '3'

services:
  nginx:
    image: nginx:stable
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/certs
    networks:
      - custom_net
    depends_on:
      - site1
      - site2
      - site3

  site1:
    build: ./site1
    container_name: site1
    volumes:
      - ./site1:/var/www/html
    networks:
      custom_net:
        ipv4_address: 172.26.0.11

  site2:
    build: ./site2
    container_name: site2
    volumes:
      - ./site2:/var/www/html
    networks:
      custom_net:
        ipv4_address: 172.26.0.12

  site3:
    build: ./site3
    container_name: site3
    volumes:
      - ./site3:/var/www/html
    networks:
      custom_net:
        ipv4_address: 172.26.0.13

networks:
  custom_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.26.0.0/24


# change C:\Windows\System32\drivers\etc\hosts
