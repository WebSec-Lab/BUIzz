# ==========================================================
# Nginx Configuration for Three Reverse Proxies (HTTPS Frontend)
# ==========================================================

# Map ?policy= query param to a validated Referrer-Policy value
map $arg_policy $rp_policy_header {
    default                             "";
    "no-referrer"                       "no-referrer";
    "no-referrer-when-downgrade"        "no-referrer-when-downgrade";
    "origin"                            "origin";
    "origin-when-cross-origin"          "origin-when-cross-origin";
    "same-origin"                       "same-origin";
    "strict-origin"                     "strict-origin";
    "strict-origin-when-cross-origin"   "strict-origin-when-cross-origin";
    "unsafe-url"                        "unsafe-url";
}

# -----------------------------
# 1. attacker.test
# -----------------------------
server {
    listen 443 ssl;
    server_name attacker.test;

    ssl_certificate     /etc/nginx/certs/leak.test+2.pem;
    ssl_certificate_key /etc/nginx/certs/leak.test+2-key.pem;
    location / {
        proxy_pass http://site1;

        proxy_set_header Host $host;
        proxy_redirect http:// https://;
        add_header Referrer-Policy $rp_policy_header always;
    }
}

# -----------------------------
# 2. adition.com
# -----------------------------
server {
    listen 443 ssl;
    server_name adition.com;

    ssl_certificate     /etc/nginx/certs/leak.test+2.pem;
    ssl_certificate_key /etc/nginx/certs/leak.test+2-key.pem;

    location / {
        proxy_pass http://site2;
        proxy_set_header Host $host;
        proxy_redirect http:// https://;
        proxy_set_header X-Referer $http_referer;
        add_header Referrer-Policy $rp_policy_header always;
    }
}

# -----------------------------
# 3. leak.test
# -----------------------------
server {
    listen 443 ssl;
    server_name leak.test;

    ssl_certificate     /etc/nginx/certs/leak.test+2.pem;
    ssl_certificate_key /etc/nginx/certs/leak.test+2-key.pem;

    location / {
        proxy_pass http://site3;
        proxy_set_header Host $host;

        proxy_redirect http:// https://;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Referrer-Policy $rp_policy_header always;
    }
}